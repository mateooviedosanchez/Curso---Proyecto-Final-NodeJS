<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/empleados.js"></script>
</head>

<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mt-4">
            <h1>Empleados</h1>
            <button class="btn btn-outline-danger" id="btn-logout">Cerrar sesión</button>
        </div>

        <div class="card mt-3">
            <div class="card-body">
                <h5 id="form-title">Agregar empleado</h5>
                <input type="hidden" id="input-id">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="input-name">Nombre</label>
                        <input type="text" class="form-control" id="input-name">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="input-lastname">Apellidos</label>
                        <input type="text" class="form-control" id="input-lastname">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="input-phone">Teléfono</label>
                        <input type="text" class="form-control" id="input-phone">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="input-mail">Correo electrónico</label>
                        <input type="email" class="form-control" id="input-mail">
                    </div>
                    <div class="form-group col-12">
                        <label for="input-address">Dirección</label>
                        <input type="text" class="form-control" id="input-address">
                    </div>
                </div>
                <button class="btn btn-primary" id="btn-save">Guardar</button>
                <button class="btn btn-secondary" id="btn-cancel">Cancelar</button>
            </div>
        </div>

        <div class="input-group mt-4">
            <input type="text" class="form-control" id="input-search" placeholder="Buscar empleado por nombre">
            <div class="input-group-append">
                <button class="btn btn-primary" id="btn-search">Buscar</button>
                <button class="btn btn-secondary" id="btn-all">Ver todos</button>
            </div>
        </div>

        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Dirección</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</body>
</html>
